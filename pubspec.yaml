name: kasseneck_api
description: "RKSV-Registrierkasse für Flutter: signierte Belege, hobex- und Stripe-Kartenzahlung, Bondruck. Austrian cash register by Kreiseck."
version: 6.1.0
homepage: https://github.com/mhmmdlkts/kasseneck_flutter_api
repository: https://github.com/mhmmdlkts/kasseneck_flutter_api
issue_tracker: https://github.com/mhmmdlkts/kasseneck_flutter_api/issues

topics: [rksv, point-of-sale, payments, receipts, austria]

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  path_provider: ^2.1.5
  qr: ^3.0.2
  qr_flutter: ^4.1.0
  flutter_blue_plus: ^2.3.4
  kreiseck_design: ^0.1.0
  sumup: ^0.13.1 # 0.14.x zieht den gated Tap-to-Pay-SDK (privates Maven-Repo, Credentials nötig) – wird nicht genutzt
    #path: ../sumup_flutter_plugin
  my_pos: ^0.3.0
    #path: ../mypos_flutter_package/my_pos/my_pos

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.8.0
  crypto: ^3.0.3
  yaml: ^3.1.2 # nur für die Zwillingsprüfung; nicht Teil der veröffentlichten Abhängigkeiten

flutter:
  assets:
    - assets/kreiseck_logo_print.png