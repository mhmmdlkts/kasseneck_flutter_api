# Woran dieses Paket geprüft wird.
#
# Das npm-Paket @kreiseck/kasseneck-api ist die Quelle: es gibt in fixtures/
# die Vertragsdateien aus (Oberfläche, Standardwerte, Goldens, seit 1.0 auch
# den Backend-Vertrag unter v3/, die gespeicherte Form unter stored/ und die
# Umbenennungstabelle renames-1.0.json), die im veröffentlichten Tarball
# mitreisen. Dieses Repo hält eine Kopie unter test/fixtures/vertrag/, damit
# `flutter test` ohne Netz vollständig ist; die CI beweist byteweise, dass die
# Kopie echt ist.
#
# Nachziehen: npm_version hochsetzen, `tool/zwillinge.sh ziehen`, `flutter test`.
# Der Testlauf sagt dann genau, was fehlt.
#
npm_version: 1.0.0-rc.1

# Alle benannten Abweichungen stehen in dieser Datei, in zwei Abschnitten und
# unter derselben Strenge (test/zwillinge_liste.dart liest beide gleich):
#
#   ausnahmen       : was der Vertrag führt und dieses Paket nicht
#   wert_ausnahmen  : Felder, die es hier gibt, deren Standardwert aber abweicht
#
# Zwei Arten, in beiden Abschnitten:
#   nicht_zutreffend : dauerhaft, braucht einen Grund
#   offen            : Schuld, braucht eine Issue-Nummer
#
# Die Einträge tragen seit 1.0 die Namen aus surface.json und
# pos-settings-defaults.json: `calls.<name>` (calls.public und calls.pos
# zusammen), `enums.<feld>.<wert>`, `posShortcutActions.<aktion>`,
# `registerPerms.<recht>`, `device.<feld>`. Die alten Namen (aufrufe.*,
# enums.druckerArt.*, tastenAktionen.*, geraet.*) übersetzt renames-1.0.json.
#
# Stand 1.0.0-rc.1: 20 Einträge "nicht zutreffend" (Partner-API), 35 "offen"
# (33 in ausnahmen, 2 in wert_ausnahmen). Keine der 33 Lücken aus 0.30.0 ist
# durch 1.0 entfallen: der Vertrag führt jede weiter, nur unter englischem
# Namen, und dieses Paket hat keine davon geschlossen. Neu sind drei:
# reportCustomerContract (Partner-API), setMyKasseLogo (#24) und die
# Tasten-Aktion splitPayment (#25, aus npm 0.31.0).
#
# Keiner der offenen Einträge ist "nicht zutreffend": ein Gerät kann in den
# Einstellungen auf einen Wert gesetzt sein, den dieses Paket nicht kennt.
# Dann fällt es still auf den Standard zurück, und am Tresen steht ein
# Schalter anders als im Panel. Kennen muss das Paket den Wert also auch dort,
# wo es ihn (noch) nicht auswerten kann.
#
# Wer eine Lücke schließt, streicht die Zeile hier. Wer die Zeile streicht,
# ohne die Lücke zu schließen, wird rot, und wer die Lücke schließt, ohne die
# Zeile zu streichen, ebenfalls: sonst sänke die Zahl in der CI nie.
