name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Die Kopie unter test/fixtures/vertrag/ ist die Grundlage aller
      # Zwillingsprüfungen. Geschrieben wird sie nur von
      # `tool/zwillinge.sh ziehen` — hier wird byteweise bewiesen, dass sie
      # das veröffentlichte Paket ist und nicht von Hand nachgebessert wurde.
      - name: Vertrag — ist die Kopie echt?
        run: tool/zwillinge.sh pruefen

      # Sichtbar machen, was noch aussteht: jede Zeile ist ein benannter
      # Eintrag mit Issue-Nummer in zwillinge.yaml. Gezählt wird geparst statt
      # gegrept und über beide Abschnitte — siehe tool/offene_eintraege.dart.
      - name: Offene Zwillings-Einträge
        run: dart run tool/offene_eintraege.dart

      # Der Schritt weiter oben beweist, dass die Kopie zu `npm_version`
      # gehört — nicht, dass `npm_version` noch aktuell ist. Ohne diesen
      # Schritt bliebe der Lauf auch dann grün, wenn auf npm längst eine
      # Version mit neuen Feldern oder Enum-Werten steht: die Kopie wäre echt
      # und trotzdem veraltet.
      #
      # WARNUNG, KEIN TOR — zweifach abgesichert: das Werkzeug endet von sich
      # aus immer mit 0 (auch ohne Netz), und `continue-on-error` hält den Lauf
      # selbst dann grün, wenn `dart run` scheitert. Nachgezogen wird von Hand;
      # eine Veröffentlichung in einem fremden Repository darf den Bau hier
      # nicht anhalten.
      - name: Stand der Anheftung (nur Hinweis)
        continue-on-error: true
        run: dart run tool/vertrag_stand.dart

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test
