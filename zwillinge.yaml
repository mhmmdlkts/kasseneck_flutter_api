  # ---- Issue #23: Druckweg connect und Terminal-Anbindung ----
  # Kasseneck Connect als vierter Druckweg, dazu die vier Felder
  # connectPrinterId, terminalVia, terminalType und terminalTid (0.x:
  # connectDruckerId, terminalVia, terminalArt, terminalTid). Ein auf
  # "connect" gestelltes Gerät druckt hier heute anders als eingestellt, und
  # ohne connectPrinterId wüsste es selbst dann nicht, welcher Drucker am
  # Helfer gemeint ist.
  #
  # Die Felder selbst tragen unten keine eigene Zeile: aufgezählt sind hier
  # die WERTE, die der Vertrag führt und dieses Paket nicht, und ein Feld ohne
  # Aufzählung hat keine. Aufgeschrieben sein müssen sie trotzdem:
  # connectDruckerId war eine Zeitlang weder hier noch in einer Wertezeile
  # genannt und damit die einzige Lücke, die nur im Issue stand.
  - eintrag: enums.printerType.connect
    art: offen
    issue: 23
  - eintrag: enums.terminalVia.direct
    art: offen
    issue: 23
  - eintrag: enums.terminalVia.connect
    art: offen
    issue: 23
  - eintrag: enums.terminalType.none
    art: offen
    issue: 23
  - eintrag: enums.terminalType.hps
    art: offen
    issue: 23

