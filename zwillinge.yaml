# Woran dieses Paket geprüft wird.
#
# Das npm-Paket @kreiseck/kasseneck-api ist die Quelle: es gibt in fixtures/
# zwei Beschreibungsdateien aus (Standardwerte, Oberfläche), die im
# veröffentlichten Tarball mitreisen. Dieses Repo hält eine Kopie unter
# test/fixtures/vertrag/, damit `flutter test` ohne Netz vollständig ist — die
# CI beweist byteweise, dass die Kopie echt ist.
#
# Nachziehen: npm_version hochsetzen, `tool/zwillinge.sh ziehen`, `flutter test`.
# Der Testlauf sagt dann genau, was fehlt.
npm_version: 0.6.45

# Was dieses Paket bewusst NICHT hat. Zwei Arten:
#   nicht_zutreffend — dauerhaft, braucht einen Grund
#   offen            — Schuld, braucht eine Issue-Nummer
#
# Alle 31 Einträge sind derzeit "offen". Keiner ist "nicht zutreffend": ein
# Gerät kann in den Einstellungen auf einen Wert gesetzt sein, den dieses Paket
# nicht kennt — dann fällt es still auf den Standard zurück, und am Tresen
# steht ein Schalter anders als im Panel. Kennen muss das Paket den Wert also
# auch dort, wo es ihn (noch) nicht auswerten kann.
#
# Wer eine Lücke schließt, streicht die Zeile hier. Wer die Zeile streicht,
# ohne die Lücke zu schließen, wird rot.
ausnahmen:
  # ---- Issue #22: Server Direct Print ----
  # Druckjobs über das Backend anlegen und abfragen; dieses Paket druckt nur
  # direkt (ePOS/IP, Bluetooth, USB).
  - eintrag: aufrufe.listMyPrinters
    art: offen
    issue: 22
  - eintrag: aufrufe.createPrintJob
    art: offen
    issue: 22
  - eintrag: aufrufe.getPrintJob
    art: offen
    issue: 22

  # ---- Issue #23: Druckweg connect und Terminal-Anbindung ----
  # Kasseneck Connect als vierter Druckweg, dazu terminalVia/terminalArt/
  # terminalTid. Ein auf "connect" gestelltes Gerät druckt hier heute anders
  # als eingestellt.
  - eintrag: enums.druckerArt.connect
    art: offen
    issue: 23
  - eintrag: enums.terminalVia.direkt
    art: offen
    issue: 23
  - eintrag: enums.terminalVia.connect
    art: offen
    issue: 23
  - eintrag: enums.terminalArt.keins
    art: offen
    issue: 23
  - eintrag: enums.terminalArt.hps
    art: offen
    issue: 23

